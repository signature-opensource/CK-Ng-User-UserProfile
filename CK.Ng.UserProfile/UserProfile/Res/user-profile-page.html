<div class="ck-user-profile-left-card">
    @if( userProfile() ) {
        @let profile = userProfile()!;
        <nz-avatar class="ck-user-profile-avatar"
                   [nzSize]="avatarSize"
                   [nzText]="avatarFallback()"
                   [nzSrc]="avatarImgSrc()" />
        <span class="username">{{ profile.userName }}</span>

        <div class="profile-properties">
            <!-- <PreProfilePropsRegistration revert /> -->

            <!-- <PostProfilePropsRegistration /> -->
        </div>
    }
</div>
<div class="ck-user-profile-right-card">
    <!-- Not animated: the animated tabs need the Angular animations (an application without them shows every pane);
         the inactive panes are hidden by their class. -->
    <nz-tabset nzSize="large" class="ck-user-profile-tabset" [nzAnimated]="false">
        <!-- <PreUserProfileTabsRegistration revert /> -->

        <!-- <PreUserProfileGeneralInfosTab revert /> -->
        <nz-tab [nzTitle]="'CK.UserProfile.GeneralInfos' | translate">
            <ng-template nz-tab>
                <ck-user-update-form />
            </ng-template>
        </nz-tab>
        <!-- <PostUserProfileGeneralInfosTab /> -->

        <!-- <PreUserProfileSignInMethodsTab revert /> -->
        <nz-tab [nzTitle]="'CK.UserProfile.SignInMethods' | translate">
            <ng-template nz-tab>
                <ck-sign-in-methods />
            </ng-template>
        </nz-tab>
        <!-- <PostUserProfileSignInMethodsTab /> -->

        <!-- <PostUserProfileTabsRegistration /> -->
    </nz-tabset>
</div>
